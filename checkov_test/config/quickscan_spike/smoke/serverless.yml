service: quick-scan-smoke
provider:
  name: aws
  runtime: python3.9
  region: us-east-1
functions:
  hello:
    handler: handler.hello
    events:
      - http:
          path: hello
          method: get
resources:
  Resources:
    SmokeBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: quick-scan-serverless-bucket
