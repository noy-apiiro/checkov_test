AWSTemplateFormatVersion: '2010-09-09'
Description: Quick-scan IaC smoke fixture (CloudFormation)
Resources:
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: quick-scan-unencrypted-bucket
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: open to the world
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
