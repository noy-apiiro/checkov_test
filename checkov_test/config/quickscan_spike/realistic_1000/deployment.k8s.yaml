  namespace: shop
data:
  APP_NAME: api-9
  TIMEOUT: "30" 
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-9
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-9
  minReplicas: 2
  maxReplicas: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-9
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api-9.shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-9
                port:
                  number: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api-9-db
  namespace: shop
spec:
  serviceName: api-9-db
  replicas: 1
  selector:
    matchLabels:
      app: api-9-db
  template:
    metadata:
      labels:
        app: api-9-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-9-cleanup
  namespace: shop
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: api-9-tools:1.0.0
              command: ["/bin/cleanup"]
